<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AEGIS — Інфопротистояння · v0.3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0F1A; --panel:#111A2B; --panel2:#172236; --line:#26364F;
  --text:#E9EFF8; --muted:#8DA0BC;
  --hostile:#E5484D; --hostile-dim:#4A181C;
  --gold:#F5C542; --gold-dim:#54430F;
  --ok:#4CC38A; --purple:#B26AC4;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(900px 500px at 50% -8%, #131F38 0%, var(--bg) 60%);
  color:var(--text); font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
/* CRT сканлайни */
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:100;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px);}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:99;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.32) 100%);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px}
.mono{font-family:'JetBrains Mono',monospace}
.px{font-family:'Press Start 2P',monospace}

/* ===== HUD ===== */
.topbar{position:sticky;top:0;z-index:50;background:rgba(10,15,26,.94);backdrop-filter:blur(8px);border-bottom:2px solid var(--line);padding:10px 16px 10px}
.topbar-inner{max-width:640px;margin:0 auto}
.tb-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.tb-title{font-family:'Press Start 2P';font-size:10px;letter-spacing:.02em}
.tb-title .x{color:var(--gold)}
.tb-prog{font-family:'Press Start 2P';font-size:8px;color:var(--muted)}
.infl{position:relative;height:24px;border:2px solid var(--line);overflow:hidden;
  background:linear-gradient(90deg,var(--hostile-dim) 0%,#141F33 46%,#141F33 54%,var(--gold-dim) 100%)}
.infl-fill{position:absolute;inset:0;background:
  repeating-linear-gradient(-55deg,rgba(229,72,77,.30) 0 6px,transparent 6px 12px);
  transition:clip-path .7s cubic-bezier(.22,1,.36,1)}
.infl-seg{position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 calc(4% - 2px),var(--bg) calc(4% - 2px) 4%)}
.infl-marker{position:absolute;top:-2px;bottom:-2px;width:6px;background:var(--gold);
  box-shadow:0 0 10px var(--gold);transition:left .7s cubic-bezier(.22,1,.36,1)}
.infl-num{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:'Press Start 2P';font-size:10px;color:var(--text);text-shadow:0 1px 4px #000;z-index:2}
.hud2{display:flex;justify-content:space-between;align-items:center;margin-top:7px;font-family:'JetBrains Mono';font-size:11px;color:var(--muted);letter-spacing:.05em}
.hud2 .streak{color:var(--gold)}
.hud2 .streak.cold{color:var(--muted)}
.hud2 .rep{color:var(--ok)}
.hud2 .rep.low{color:var(--hostile)}
.hud2 .badges span{letter-spacing:2px}
.infl-labels{display:flex;justify-content:space-between;font-family:'JetBrains Mono';font-size:10px;margin-top:5px;letter-spacing:.1em}
.infl-labels .l{color:var(--hostile)}.infl-labels .r{color:var(--gold)}
.toast{position:fixed;top:110px;left:50%;transform:translateX(-50%) translateY(-8px);z-index:110;
  font-family:'JetBrains Mono';font-size:13px;font-weight:500;padding:8px 16px;border:2px solid;
  opacity:0;pointer-events:none;transition:all .4s ease}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.plus{background:#0F241B;color:var(--ok);border-color:#1F4A36}
.toast.minus{background:#2B1517;color:var(--hostile);border-color:#5A1D22}

/* ===== Загальне ===== */
.screen{animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.eyebrow{font-family:'Press Start 2P';font-size:9px;letter-spacing:.06em;color:var(--gold);margin-bottom:12px;line-height:1.7}
h1{font-family:'Press Start 2P';font-size:clamp(22px,6vw,34px);line-height:1.25;margin-bottom:16px}
h2{font-family:'Press Start 2P';font-size:clamp(13px,4vw,18px);line-height:1.5;margin-bottom:12px}
.lead{color:var(--muted);font-size:15px;line-height:1.6;margin-bottom:8px}
.card{background:var(--panel);border:2px solid var(--line);padding:18px;margin-bottom:12px}
.btn{display:block;width:100%;text-align:center;font-family:'Press Start 2P';font-size:11px;
  padding:16px 12px;border:2px solid #000;cursor:pointer;line-height:1.5;
  background:var(--gold);color:#12100A;box-shadow:0 4px 0 #000;transition:transform .08s,box-shadow .08s;margin-top:16px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible,.opt:focus-visible,.msg:focus-visible,.mode:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn.ghost{background:var(--panel);color:var(--muted);border-color:var(--line);box-shadow:0 4px 0 #060B14}
.task{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border:2px solid var(--line);
  border-left:4px solid var(--gold);padding:12px 14px;margin-bottom:14px;font-size:14px;line-height:1.5}
.task b{color:var(--gold)}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-5px)}45%{transform:translateX(5px)}70%{transform:translateX(-3px)}90%{transform:translateX(3px)}}
.shake{animation:shake .45s ease}

/* ===== Режими / ролі ===== */
.modes{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.mode{background:var(--panel);border:2px solid var(--line);padding:16px;cursor:pointer;
  transition:border-color .2s;position:relative;text-align:left;width:100%;color:var(--text)}
.mode:not(.locked):hover{border-color:var(--gold)}
.mode-name{font-family:'Press Start 2P';font-size:11px;margin-bottom:8px;line-height:1.5}
.mode-desc{font-size:13px;color:var(--muted);line-height:1.55}
.mode-badge{position:absolute;top:12px;right:12px;font-family:'Press Start 2P';font-size:7px;padding:5px 8px}
.mode-badge.live{background:var(--gold);color:#12100A}
.mode-badge.lock{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.mode.locked{opacity:.5;cursor:default}
.role-stats{display:flex;gap:14px;margin-top:10px;font-family:'JetBrains Mono';font-size:11px;color:var(--gold)}

/* ===== Мапа кампанії ===== */
.map{display:flex;align-items:flex-start;justify-content:space-between;margin:26px 0 8px;position:relative}
.map::before{content:'';position:absolute;top:17px;left:8%;right:8%;height:3px;background:var(--line);z-index:0}
.node{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:8px;width:19%}
.node .dot{width:34px;height:34px;border:3px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;font-family:'Press Start 2P';font-size:11px;color:var(--muted)}
.node.done .dot{background:var(--gold);border-color:var(--gold);color:#12100A}
.node.cur .dot{border-color:var(--gold);color:var(--gold);animation:blink 1.1s steps(2) infinite}
.node.boss .dot{border-color:var(--hostile);color:var(--hostile)}
.node.boss.cur .dot{background:var(--hostile-dim)}
.node .nlabel{font-family:'JetBrains Mono';font-size:9px;color:var(--muted);text-align:center;line-height:1.4;letter-spacing:.03em}
.node.boss .nlabel{color:var(--hostile)}
@keyframes blink{50%{opacity:.35}}
.cliff{background:var(--panel2);border:2px solid var(--line);border-left:4px solid var(--purple);padding:12px 14px;font-size:13px;color:#C9B3D6;line-height:1.6;margin-top:16px}
.cliff b{font-family:'JetBrains Mono';font-size:10px;color:var(--purple);display:block;margin-bottom:5px;letter-spacing:.12em}

/* ===== Стрічка ===== */
.feed{display:flex;flex-direction:column;gap:10px}
.msg{background:var(--panel);border:2px solid var(--line);padding:12px 14px;cursor:pointer;
  transition:border-color .15s;position:relative}
.msg:hover{border-color:#3A4E73}
.msg-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}
.msg-author{font-weight:600;font-size:13px;color:#B8C8E2}
.msg-meta{font-family:'JetBrains Mono';font-size:10px;color:var(--muted);white-space:nowrap}
.msg-text{font-size:14px;line-height:1.55}
.msg-views{font-family:'JetBrains Mono';font-size:10px;color:var(--muted);margin-top:8px;text-align:right}
.msg.sel{border-color:var(--gold)}
.msg.hit{border-color:var(--hostile)}
.msg.missed{border-color:var(--hostile);border-style:dashed}
.msg.safe{border-color:var(--ok)}
.msg .tag{position:absolute;top:-11px;right:10px;font-family:'Press Start 2P';font-size:7px;padding:4px 7px}
.msg .tag.h{background:var(--hostile);color:#fff}
.msg .tag.hs{background:var(--purple);color:#fff}
.msg .tag.n{background:#1F4A36;color:var(--ok)}
.locked-feed{pointer-events:none}

/* ===== Опції ===== */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:var(--panel);border:2px solid var(--line);padding:14px;cursor:pointer;
  text-align:left;color:var(--text);font-family:'Inter';font-size:14px;line-height:1.5;transition:border-color .15s;width:100%}
.opt:hover{border-color:#3A4E73}
.opt b{display:block;font-size:13px;margin-bottom:4px;color:#B8C8E2}
.opt.good{border-color:var(--ok);background:#0F231B}
.opt.bad{border-color:var(--hostile);background:#231216}
.opt.mid{border-color:var(--gold-dim)}
.opt.dim{opacity:.4}
.expl{margin-top:8px;font-size:13px;color:var(--muted);line-height:1.5;border-top:1px dashed var(--line);padding-top:8px}

/* ===== Таймер ===== */
.timer{display:flex;align-items:center;gap:10px;font-family:'Press Start 2P';font-size:11px;color:var(--muted);
  background:var(--panel2);border:2px solid var(--line);padding:10px 12px;margin-bottom:12px}
.timer .t{color:var(--gold);min-width:30px}
.timer.hot .t{color:var(--hostile);animation:blink .8s steps(2) infinite}
.timer-bar{flex:1;height:8px;background:var(--line);overflow:hidden}
.timer-bar i{display:block;height:100%;background:var(--gold);transition:width 1s linear}
.timer.hot .timer-bar i{background:var(--hostile)}
.timer .note{font-family:'JetBrains Mono';font-size:10px}

/* ===== Wildcard ===== */
.wild{border:2px solid var(--purple);background:linear-gradient(160deg,#1B1426,var(--panel));padding:18px;margin-bottom:12px}
.wild h3{font-family:'Press Start 2P';font-size:10px;color:var(--purple);margin-bottom:12px;line-height:1.7}
.wild p{font-size:14px;line-height:1.6}

/* ===== Фінал ===== */
.debrief{border-left:4px solid var(--gold)}
.rank{font-family:'Press Start 2P';font-size:clamp(16px,5vw,24px);line-height:1.5;margin:14px 0}
.rank.gold{color:var(--gold)} .rank.mid{color:#B8C8E2} .rank.low{color:var(--hostile)}
.stat{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.stat:last-child{border-bottom:none}
.stat .v{font-family:'JetBrains Mono';color:var(--gold)}
.vuln-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{font-family:'Press Start 2P';font-size:8px;padding:7px 10px;border:2px solid;line-height:1.4}
.chip.ok{color:var(--ok);border-color:#1F4A36;background:#0F231B}
.chip.vuln{color:var(--hostile);border-color:#5A1D22;background:#231216}
.crisis{background:#231216;border:2px solid #5A1D22;padding:16px;margin-bottom:12px}
.crisis h3{font-family:'Press Start 2P';font-size:10px;color:var(--hostile);margin-bottom:10px;line-height:1.7}
.crisis p{font-size:14px;color:#D8A9AC;line-height:1.6}
.demo-note{background:var(--panel2);border:2px solid var(--gold-dim);padding:18px;margin:16px 0;text-align:left}
.demo-note h3{font-family:'Press Start 2P';font-size:9px;color:var(--gold);margin-bottom:12px;line-height:1.7}
.demo-note ul{list-style:none}
.demo-note li{font-size:13px;color:var(--muted);line-height:1.7;padding-left:16px;position:relative}
.demo-note li::before{content:"▸";position:absolute;left:0;color:var(--gold)}
.footer-note{font-family:'JetBrains Mono';font-size:10px;color:#4A5A75;text-align:center;margin-top:28px;letter-spacing:.08em}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="topbar" id="topbar" style="display:none">
  <div class="topbar-inner">
    <div class="tb-row">

</div>

<div class="wrap" id="app"></div>

},

const app = document.getElementById('app');
const S = { role:null, i:0, infl:50, rep:100, streak:0, correct:0, total:0,
            picks:new Set(), audience:null, cons:0, results:[], badges:[], usedWild:[], timerCut:0 };
let timerInt=null, wtimerInt=null;

function clamp(v){return Math.max(4,Math.min(100,v))}
function pen(v){ return Math.round(v * S.role.pen); } /* v від'ємне */
function gainAdj(v, isCounter){
  let m = 1;
  if(S.streak>=5) m=2; else if(S.streak>=3) m=1.5;
  v = Math.round(v*m);
  if(isCounter && S.rep<50){ v = Math.ceil(v/2); setTimeout(()=>toast('Довіра низька: вам менше вірять','minus0'),1700); }
  return v;
}
function setInfl(delta,label){
  S.infl = clamp(S.infl + delta);
  const m = document.getElementById('inflMarker'), f = document.getElementById('inflFill'), n = document.getElementById('inflNum');
  m.style.left = 'calc('+S.infl+'% - 3px)';
  f.style.clipPath = 'inset(0 '+S.infl+'% 0 0)';
  n.textContent = S.infl;
  if(delta!==0) toast((delta>0?'+':'')+delta+' '+(label||''), delta>0);
  hud();
}
function setRep(delta){
  if(!delta) return;
  S.rep = Math.max(0,Math.min(100,S.rep+delta));
  hud();
}
function hud(){
  const st=document.getElementById('hudStreak'), rp=document.getElementById('hudRep'), bd=document.getElementById('hudBadges');
  if(!st) return;
  let mult = S.streak>=5?' ×2':(S.streak>=3?' ×1.5':'');
  st.textContent = 'СЕРІЯ '+S.streak+mult;
  st.className = 'streak'+(S.streak>=3?'':' cold');
  rp.textContent = 'ДОВІРА '+S.rep;
  rp.className = 'rep'+(S.rep<50?' low':'');
  bd.innerHTML = '<span>'+SCENARIOS.map(sc=>S.badges.includes(sc.badge)?'▣':'▢').join('')+'</span>';
}
let toastT;
function toast(txt,plus){
  const t=document.getElementById('toast');
  t.textContent=txt; t.className='toast show '+(plus===true||plus==='plus'?'plus':'minus');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1700);
}
function prog(){ document.getElementById('prog').textContent = (S.i+1)+'/'+SCENARIOS.length; }
function render(html){ stopAllTimers(); app.innerHTML = '<div class="screen">'+html+'</div>'; window.scrollTo({top:0}); }
function shuffled(n){ const a=[...Array(n).keys()]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function stopAllTimers(){ if(timerInt){clearInterval(timerInt);timerInt=null;} if(wtimerInt){clearInterval(wtimerInt);wtimerInt=null;} }

function startTimer(seconds){
  let left = seconds;
  const el=document.getElementById('timerT'), bar=document.getElementById('timerBar'), box=document.getElementById('timerBox');
  timerInt = setInterval(()=>{
    left--;
    if(el) el.textContent = left;
    if(bar) bar.style.width = (left/seconds*100)+'%';
    if(left<=12 && box) box.classList.add('hot');
    if(left>0 && left%9===0) setInfl(pen(-2),'Інфовакуум');
    if(left<=0){ clearInterval(timerInt); timerInt=null; if(el) el.textContent='0'; }
  },1000);
}

function pickMsg(idx){
  const el = document.querySelector('.msg[data-i="'+idx+'"]');
  if(S.picks.has(idx)){ S.picks.delete(idx); el.classList.remove('sel'); }
  else { S.picks.add(idx); el.classList.add('sel'); }
  document.getElementById('confirmBtn').disabled = S.picks.size===0;
}

function resolveFeed(){
  const sc = SCENARIOS[S.i];
  const picked = [...S.picks];
  document.getElementById('feed').classList.add('locked-feed');
  document.getElementById('confirmBtn').style.display='none';
  let gain=0, loss=0, hostileTotal=0, hostileFound=0, falseAlarms=0;
  sc.feed.forEach((m,idx)=>{
    const el = document.querySelector('.msg[data-i="'+idx+'"]');
    el.classList.remove('sel');
    if(m.h){
      hostileTotal++;
      const subtle = m.tier==='sub';
      if(picked.includes(idx)){
        hostileFound++;
        gain += subtle?8:5;
        el.classList.add('hit');
        el.insertAdjacentHTML('afterbegin','<span class="tag '+(subtle?'hs':'h')+'">'+(subtle?'ТОНКИЙ ×2':'НАРАТИВ')+'</span>');
      } else {
        loss += -6;
        el.classList.add('missed','shake');
        el.insertAdjacentHTML('afterbegin','<span class="tag '+(subtle?'hs':'h')+'">ПРОПУЩЕНО</span>');
      }
    } else if(picked.includes(idx)){
      falseAlarms++;
      loss += -6;
      el.classList.add('safe','shake');
      el.insertAdjacentHTML('afterbegin','<span class="tag n">ХИБНА ТРИВОГА</span>');
      el.insertAdjacentHTML('beforeend','<div class="expl">'+m.w+'</div>');
    }
  });
  S.total += hostileTotal;
  S.correct += hostileFound;
  const clean = (hostileFound===hostileTotal && falseAlarms===0);
  S._spotClean = clean;
  if(clean){ S.streak++; } else { S.streak=0; }
  const delta = (clean?gainAdj(gain):gain) + pen(loss);
  setTimeout(()=>{ setInfl(delta, delta>0?'Розпізнавання':'Промахи'); },350);
  app.querySelector('.screen').insertAdjacentHTML('beforeend',
    '<button class="btn" onclick="wildThen(\'phaseTech\')">ДАЛІ · АНАЛІЗ ТЕХНІКИ</button>');
}

/* ---------- Wildcard ---------- */
function wildThen(fnName){
  const pool = WILD.filter(w=>!S.usedWild.includes(w.id));
  if(pool.length && Math.random() < S.role.wild){
    const w = pool[Math.floor(Math.random()*pool.length)];
    S.usedWild.push(w.id);
    showWild(w, fnName);
  } else {
    window[fnName]();
  }
}
function showWild(w, fnName){
  if(w.type==='inst'){
    render(`
      <div class="eyebrow" style="color:var(--purple)">НЕОЧІКУВАНА ПОДІЯ</div>
      <div class="wild">
        <h3>${w.h}</h3>
        <p>${w.p}</p>
      </div>
      <button class="btn" onclick="window['${fnName}']()">ПРИЙНЯТИ Й ПРАЦЮВАТИ ДАЛІ</button>`);
    setTimeout(()=>{
      if(w.fx) setInfl(w.fx>0?w.fx:pen(w.fx), w.fx>0?'Подія':'Подія');
      if(w.rep) setRep(w.rep);
      if(w.timerCut) S.timerCut = w.timerCut;
    },450);
  } else {
    render(`
      <div class="eyebrow" style="color:var(--purple)">НЕОЧІКУВАНА ПОДІЯ · 15 СЕКУНД</div>
      <div class="wild">
        <h3>${w.h}</h3>
        <p>${w.p}</p>
      </div>
      <div class="timer" id="wBox">⏱ <span class="t" id="wT">15</span><div class="timer-bar"><i id="wBar" style="width:100%"></i></div></div>
      <div class="opts">
        <button class="opt" id="wOptA" onclick="wildPick('a')"><b>${w.a.t}</b></button>
        <button class="opt" id="wOptB" onclick="wildPick('b')"><b>${w.b.t}</b></button>
      </div>`);
    S._wild = w; S._wildNext = fnName;
    let left=15;
    wtimerInt = setInterval(()=>{
      left--;
      const el=document.getElementById('wT'), bar=document.getElementById('wBar'), box=document.getElementById('wBox');
      if(el) el.textContent=left;
      if(bar) bar.style.width=(left/15*100)+'%';
      if(left<=5 && box) box.classList.add('hot');
      if(left<=0){ clearInterval(wtimerInt); wtimerInt=null; wildPick('b',true); }
    },1000);
  }
}
function wildPick(key, timedOut){
  if(wtimerInt){ clearInterval(wtimerInt); wtimerInt=null; }
  const w=S._wild, o=w[key], other=w[key==='a'?'b':'a'];
  const elA=document.getElementById('wOptA'), elB=document.getElementById('wOptB');
  const picked = key==='a'?elA:elB, notPicked = key==='a'?elB:elA;
  [elA,elB].forEach(e=>e.disabled=true);
  const goodPick = o.fx>0 && !o.cons && !(o.rep&&o.rep<0);
  picked.classList.add(goodPick?'good':'bad');
  if(!goodPick) picked.classList.add('shake');
  notPicked.classList.add('dim');
  picked.insertAdjacentHTML('beforeend','<div class="expl">'+(timedOut?'Час вийшов, рішення прийняли за тебе. ':'')+o.e+'</div>');
  setInfl(o.fx>0?o.fx:pen(o.fx),'Подія');
  if(o.rep) setRep(o.rep);
  if(o.cons) S.cons++;
  app.querySelector('.screen').insertAdjacentHTML('beforeend',
    '<button class="btn" onclick="window[\''+S._wildNext+'\']()">ПРОДОВЖИТИ</button>');
}

/* ---------- Фази 2-4 ---------- */
function phaseTech(){
  const sc = SCENARIOS[S.i];
  const order = shuffled(sc.techniques.opts.length);
  render(`
    <div class="eyebrow">ФАЗА 2 · НАЗВИ ТЕХНІКУ</div>
    <div class="task">🔬 <div>${sc.techniques.q}</div></div>
    <div class="opts">
      ${order.map(idx=>{const o=sc.techniques.opts[idx];return `
        <button class="opt" data-i="${idx}" onclick="pickTech(${idx})"><b>${o.n}</b>${o.d}</button>`}).join('')}
    </div>`);
}
function pickTech(idx){
  const sc = SCENARIOS[S.i]; S.total++;
  const ok = sc.techniques.opts[idx].ok;
  S._techOK = ok;
  if(ok){ S.correct++; S.streak++; if(!S.badges.includes(sc.badge)){S.badges.push(sc.badge); setTimeout(()=>toast('БЕЙДЖ: '+sc.badge,'plus'),1800);} }
  else S.streak=0;
  sc.techniques.opts.forEach((o,j)=>{
    const el = document.querySelector('.opt[data-i="'+j+'"]');
    el.disabled = true;
    if(o.ok){ el.classList.add('good'); el.insertAdjacentHTML('beforeend','<div class="expl">'+o.e+'</div>'); }
    else if(j===idx){ el.classList.add('bad','shake'); el.insertAdjacentHTML('beforeend','<div class="expl">'+o.e+'</div>'); }
    else el.classList.add('dim');
  });
  setInfl(ok?gainAdj(7):pen(-8), ok?'Техніку розкрито':'Хибний аналіз');
  const next = sc.audiences ? 'phaseAudience' : 'phaseCounter';
  app.querySelector('.screen').insertAdjacentHTML('beforeend',
    '<button class="btn" onclick="wildThen(\''+next+'\')">ДАЛІ · ПРОТИДІЯ</button>');
}

function phaseAudience(){
  const sc = SCENARIOS[S.i];
  render(`
    <div class="eyebrow">ФАЗА 3 · НАПРЯМОК</div>
    <div class="task">📡 <div>${sc.audienceQ}</div></div>
    <div class="opts">
      ${sc.audiences.map((a,idx)=>`
        <button class="opt" onclick="pickAudience(${idx})"><b>${a.n}</b>${a.d}</button>`).join('')}
    </div>
    <p class="lead" style="margin-top:12px;font-size:13px">Обидва напрямки правильні. У повній версії команди ділять їх між собою, у демо обираєш один.</p>`);
}
function pickAudience(idx){ S.audience = idx; phaseCounter(); }

function phaseCounter(){
  const sc = SCENARIOS[S.i];
  const c = sc.audiences ? sc.audiences[S.audience].counters : sc.counters;
  const t = Math.max(12, S.role.time - S.timerCut);
  const order = shuffled(c.opts.length);
  render(`
    <div class="eyebrow">ФАЗА ${sc.audiences?'4':'3'} · КОНТРНАРАТИВ</div>
    <div class="timer" id="timerBox">⏱ <span class="t" id="timerT">${t}</span>
      <div class="timer-bar"><i id="timerBar" style="width:100%"></i></div>
      <span class="note">вакуум працює на ворога</span>
    </div>
    <div class="task">⚔️ <div>${c.q}</div></div>
    <div class="opts">
      ${order.map(idx=>{const o=c.opts[idx];return `
        <button class="opt" data-i="${idx}" onclick="pickCounter(${idx})"><b>${o.n}</b>${o.d}</button>`}).join('')}
    </div>`);
  startTimer(t);
}
function pickCounter(idx){
  if(timerInt){clearInterval(timerInt);timerInt=null;}
  const sc = SCENARIOS[S.i]; S.total++;
  const c = sc.audiences ? sc.audiences[S.audience].counters : sc.counters;
  const o = c.opts[idx];
  if(o.best){ S.correct++; S.streak++; } else S.streak=0;
  if(o.cons) S.cons++;
  if(o.rep) setRep(o.rep);
  S.results.push({tech: sc.tech, techOK: S._techOK, counterGood: !!o.best});
  c.opts.forEach((op,j)=>{
    const el = document.querySelector('.opt[data-i="'+j+'"]');
    el.disabled = true;
    let cls = op.fx>=8 ? 'good' : (op.fx<0 ? 'bad' : 'mid');
    if(j===idx){
      el.classList.add(cls);
      if(op.fx<0) el.classList.add('shake');
      el.insertAdjacentHTML('beforeend','<div class="expl">'+op.e+'</div>');
    }
    else if(op.best){ el.classList.add('good'); el.insertAdjacentHTML('beforeend','<div class="expl">'+op.e+'</div>'); }
    else el.classList.add('dim');
  });
  setInfl(o.fx>0?gainAdj(o.fx,true):pen(o.fx), o.fx>0?'Контрнаратив працює':'Хід на користь ІПСО');
  app.querySelector('.screen').insertAdjacentHTML('beforeend',
    '<button class="btn" onclick="phaseDebrief()">ДАЛІ · РОЗБІР</button>');
}

function phaseDebrief(){
  const sc = SCENARIOS[S.i];
  render(`
    <div class="eyebrow">РОЗБІР ОПЕРАЦІЇ</div>
    <h2>${sc.title}</h2>
    <div class="card debrief"><p style="line-height:1.65;font-size:15px">${sc.debrief}</p></div>
    <button class="btn" onclick="nextScenario()">${S.i < SCENARIOS.length-1 ? 'ДО МАПИ' : 'ПІДСУМОК'}</button>`);
}
function nextScenario(){
  const sc = SCENARIOS[S.i];
  if(S.i < SCENARIOS.length-1){ const cliff = sc.cliff; S.i++; campaignMap(cliff); }
  else finale();
}

function finale(){
  let crisisHtml = '';
  const doCrisis = S.cons >= 2;
  if(doCrisis){
    crisisHtml = `<div class="crisis">
      <h3>⚠ ПОДІЯ: ГУЧНЕ МОВЧАННЯ</h3>
      <p>Кілька разів ти обирав «заспокоїти» замість «відповісти». Зовні ставало тихіше, але питання без відповідей нікуди не дівались. Вони консервувались і тепер вибухнули падінням довіри. Гучне мовчання не означає відсутності проблем. Воно означає їхню консервацію. Стійкість −10.</p>
    </div>`;
  }
  const resilient = [...new Set(S.results.filter(r=>r.techOK && r.counterGood).map(r=>r.tech))];
  const vulnerable = [...new Set(S.results.filter(r=>!r.techOK || !r.counterGood).map(r=>r.tech))];

  const doRender = ()=>{
    let rank, cls, note;
    if(S.infl>=78){ rank='ІНФОСТІЙКИЙ'; cls='gold'; note='Лінія впливу на твоєму боці. Ти читаєш техніки, а не заголовки.'; }
    else if(S.infl>=52){ rank='МЕДІАГРАМОТНИЙ'; cls='mid'; note='Основу тримаєш. Частина рішень зіграла на ворожий фрейм, розбори підкажуть де саме.'; }
    else { rank='ЖЕРТВА МЕТОДИЧКИ'; cls='low'; note='Наративи пройшли крізь оборону. Хороша новина: тепер ти знаєш, де саме. А це вже половина захисту.'; }

    render(`
      <div style="padding-top:3vh;text-align:center">
        <div class="eyebrow">ПІДСУМОК КАМПАНІЇ · ${S.role.n}</div>
        <div class="rank ${cls}">${rank}</div>
        <p class="lead" style="max-width:440px;margin:0 auto 20px">${note}</p>
        ${crisisHtml}
        <div class="card" style="text-align:left">
          <div class="stat"><span>Фінальна стійкість</span><span class="v">${S.infl} / 100</span></div>
          <div class="stat"><span>Довіра до тебе</span><span class="v">${S.rep} / 100</span></div>
          <div class="stat"><span>Точні рішення</span><span class="v">${S.correct} з ${S.total}</span></div>
          <div class="stat"><span>Бейджі технік</span><span class="v">${S.badges.length} / ${SCENARIOS.length}</span></div>
        </div>
        <div class="card" style="text-align:left">
          <div class="px" style="font-size:9px;color:var(--gold);margin-bottom:10px;line-height:1.7">ПРОФІЛЬ ВРАЗЛИВОСТІ</div>
          ${resilient.length?'<div style="font-size:13px;color:var(--muted)">Стійкий до:</div><div class="vuln-row">'+resilient.map(t=>'<span class="chip ok">'+t+'</span>').join('')+'</div>':''}
          ${vulnerable.length?'<div style="font-size:13px;color:var(--muted);margin-top:10px">Зона роботи:</div><div class="vuln-row">'+vulnerable.map(t=>'<span class="chip vuln">'+t+'</span>').join('')+'</div>':'<div style="font-size:13px;color:var(--ok);margin-top:10px">Чистий прохід по всіх техніках. Рідкість.</div>'}
          <p style="font-size:12px;color:var(--muted);margin-top:12px;line-height:1.5">У повній версії профіль накопичується між сесіями і дає тренеру картину по підрозділу: які техніки пробивають людей найчастіше.</p>
        </div>
        <div class="demo-note">
          <h3>ЦЕ ДЕМО-ЗБІРКА ЯДРА</h3>
          <ul>
            <li>Мутація наративів: слабка відповідь в операції 1 повертається сильнішою у фіналі</li>
            <li>Перевірка джерела (OSINT): профіль каналу за ціну часу на таймері</li>
            <li>Прикладне ворогознавство: дерево знань про техніки, що відкриває нові контрходи</li>
            <li>Командний режим: два гравці, одна ситуація, порівняння рішень</li>
            <li>Аналітика для тренера і регіональні профілі стійкості</li>
          </ul>
          <h3 style="margin-top:14px">АДДОНИ В РОЗРОБЦІ</h3>
          <ul>
            <li>МОБІЛЬНІ ГРУПИ: читання аудиторії, побудова виступу. На базі карткової версії</li>
            <li>МІЖНАРОДНИЙ: дипломатичні сценарії, скептичні аудиторії</li>
            <li>ЧЕРВОНА КОМАНДА: сконструюй ІПСО сам і зрозумій захист зсередини</li>
          </ul>
        </div>
        <button class="btn" onclick="restart()">ЩЕ РАЗ · ІНША РОЛЬ</button>
        <button class="btn ghost" onclick="restartToModes()">ДО РЕЖИМІВ</button>
      </div>`);
  };

  if(doCrisis){
    setTimeout(()=>setInfl(-10,'Гучне мовчання'), 700);
    setTimeout(doRender, 1500);
  } else doRender();
}

function resetState(){ S.role=null; S.i=0; S.infl=50; S.rep=100; S.streak=0; S.correct=0; S.total=0; S.cons=0; S.results=[]; S.badges=[]; S.usedWild=[]; S.timerCut=0; }
function restart(){ resetState(); setInfl(0); roleSelect(); }
function restartToModes(){ resetState(); setInfl(0); modeSelect(); }

hud();
setInfl(0);
modeSelect();
</script>
</body>
</html>
